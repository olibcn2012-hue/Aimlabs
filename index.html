<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AimLabs CS2 - 31 Skins & Configuraciones</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #1a1c23;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s ease, filter 0.1s ease;
        }

        #hud {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 40px;
            font-size: 16px; font-weight: bold;
            color: #ffffff;
            background: rgba(18, 22, 31, 0.95);
            padding: 12px 40px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 5;
            pointer-events: none;
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }
        .stat span { color: #00ffff; font-family: monospace; font-size: 18px; }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 5px; height: 5px;
            transform: translate(-50%, -50%);
            background-color: #ffffff;
            border-radius: 50%;
            z-index: 4;
            pointer-events: none;
            display: none;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }

        #menu-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(13, 15, 20, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: #ffffff;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        .main-dashboard {
            display: grid;
            grid-template-columns: 340px 380px 340px;
            gap: 20px;
            max-width: 1120px;
            width: 100%;
        }

        .panel-box {
            background: #161920;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 22px;
            border-radius: 8px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
        }
        .subtitle { 
            color: #515f73; 
            font-size: 11px; 
            margin-bottom: 15px; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-align: center;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00ffff;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .coins-badge {
            background: #222733;
            border: 1px solid #f59e0b;
            color: #f59e0b;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .ban-banner {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .setting-group { margin-bottom: 15px; text-align: left; }
        label {
            display: block; font-size: 10px;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 1px;
            font-weight: 700;
        }
        
        select, input[type="text"], input[type="password"] {
            width: 100%;
            background: #0a0b0f;
            color: #f1f5f9;
            border: 1px solid #2d3748;
            padding: 10px;
            font-size: 12px;
            border-radius: 4px;
            outline: none;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .slider-container { display: flex; align-items: center; gap: 12px; }
        input[type="range"] {
            flex: 1;
            accent-color: #00ffff;
            cursor: pointer;
        }
        .slider-val { font-family: monospace; font-size: 14px; width: 45px; text-align: right; color: #00ffff; }

        button {
            background: #00ffff;
            color: #0a0b0f;
            border: none;
            padding: 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            letter-spacing: 1.5px;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: #00e5e5; }
        button:active { transform: scale(0.98); }
        button:disabled { background: #2a3241; color: #515f73; cursor: not-allowed; }

        /* MODO BLANCO / TEMA CLARO */
        body.theme-light #menu-container {
            background: rgba(235, 240, 245, 0.96);
            color: #1e293b;
        }
        body.theme-light .panel-box {
            background: #ffffff;
            border-color: #cbd5e1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        body.theme-light h1 { color: #0f172a; }
        body.theme-light .subtitle { color: #64748b; }
        body.theme-light .panel-title { color: #0284c7; border-bottom-color: #e2e8f0; }
        body.theme-light label { color: #475569; }
        body.theme-light select, body.theme-light input[type="text"], body.theme-light input[type="password"] {
            background: #f1f5f9;
            color: #0f172a;
            border-color: #cbd5e1;
        }
        body.theme-light .coins-badge {
            background: #fef3c7;
            border-color: #f59e0b;
            color: #b45309;
        }
        body.theme-light .roulette-wrapper {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        body.theme-light .inventory-item {
            background: #f8fafc;
            border-color: #cbd5e1;
        }
        body.theme-light .inventory-item-name { color: #0f172a; }
        body.theme-light .slider-val { color: #0284c7; }

        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 95px;
            overflow: hidden;
            border-radius: 6px;
            background: #0a0b0f;
            border: 2px solid #2d3748;
            margin-bottom: 12px;
        }
        .roulette-pointer {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 3px; height: 100%;
            background: #ffcc00;
            z-index: 2;
            box-shadow: 0 0 8px #ffcc00;
        }

        .roulette-track {
            display: flex;
            position: absolute;
            left: 0; top: 0; height: 100%;
            will-change: transform;
        }
        .skin-card {
            width: 85px;
            height: 85px;
            margin: 5px;
            background: #12151e;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-bottom: 4px solid #fff;
            padding: 4px;
        }
        .skin-card .skin-icon {
            width: 38px; height: 26px;
            border-radius: 3px;
            margin-bottom: 4px;
        }
        .skin-card .name {
            font-size: 8px;
            font-weight: bold;
            color: #fff;
            text-align: center;
            line-height: 1.1;
        }

        .btn-case-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-case-std { background: #f59e0b; color: #000; }
        .btn-case-std:hover { background: #d97706; }
        .btn-case-lucky { background: linear-gradient(135deg, #a855f7, #ec4899); color: #fff; }
        .btn-case-unowned { background: linear-gradient(135deg, #10b981, #3b82f6); color: #fff; }

        .inventory-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .inventory-list::-webkit-scrollbar { width: 4px; }
        .inventory-list::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 4px; }

        .inventory-item {
            background: #0a0b0f;
            border: 1px solid #2d3748;
            border-radius: 6px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .inventory-item-info { display: flex; align-items: center; gap: 10px; }
        .inventory-item-icon { width: 22px; height: 16px; border-radius: 2px; }
        .inventory-item-name { font-size: 11px; font-weight: bold; }
        .inventory-item-rarity { font-size: 9px; color: #94a3b8; }
        .btn-equip {
            width: auto; padding: 5px 10px; font-size: 9px;
            background: #334155; color: #fff;
        }
        .btn-equip.active { background: #10b981; color: #fff; }

        /* ESTILOS DEL MENÚ ADMIN / CREADOR DE SKINS */
        #admin-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 11, 15, 0.96);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .admin-box {
            background: #161920;
            border: 1px solid #00ffff;
            border-radius: 8px;
            width: 860px;
            max-width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2d3748;
            padding-bottom: 10px;
        }
        .admin-header h2 {
            margin: 0;
            color: #00ffff;
            font-size: 16px;
            letter-spacing: 1.5px;
        }
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        #preview-container {
            width: 100%;
            height: 340px;
            background: #0a0b0f;
            border: 1px solid #2d3748;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

    <div id="menu-container">

            <!-- PANEL IZQUIERDO: CAJA CS2 Y CÓDIGO ADMIN -->

    <script>
        // SISTEMA DE AUDIO (WEB AUDIO API SINTETIZADO)
        let audioCtx = null;
        let soundVolume = parseFloat(localStorage.getItem('aimlabs_sound_vol')) || 0.5;
        let isAimHacking = false; // ESTADO DEL TRUCO DE AIMBOT

        // SISTEMA DE SUSPENSIÓN DE CUENTA (ANTI-CHEAT / LÍMITE 15.000 PTS)
        function checkBanStatus() {
            const banUntil = parseInt(localStorage.getItem('aimlabs_banned_until')) || 0;
            const now = Date.now();
            if (now < banUntil) {
                const diffSecs = Math.ceil((banUntil - now) / 1000);
                const mins = Math.floor(diffSecs / 60);
                const secs = diffSecs % 60;
                return { isBanned: true, mins, secs, formatted: `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}` };
            }
            return { isBanned: false };
        }

        function triggerBan() {
            const banDuration = 15 * 60 * 1000; // 15 Minutos en milisegundos
            localStorage.setItem('aimlabs_banned_until', Date.now() + banDuration);

            isPlaying = false;
            clearInterval(gameInterval);
            if (document.pointerLockElement === document.body) {
                document.exitPointerLock();
            }

            playGameOverSound();
            alert("🚫 ¡CUENTA SUSPENDIDA!\nHas alcanzado más de 15.000 puntos en la sesión.\nTu cuenta ha sido bloqueada temporalmente durante 15 minutos.");
            updateUIValues();
        }

        setInterval(() => {
            const status = checkBanStatus();
            const banBanner = document.getElementById('ban-banner');
            const banTimer = document.getElementById('ban-timer');

            if (status.isBanned) {
                banBanner.style.display = 'block';

        // SONIDO DE DISPARO DE PISTOLA MEJORADO (RUIDO BLANCO + GOLPE GRAVE)
        function playGunshotSound() {
            if (!audioCtx || soundVolume <= 0) return;
            try {
                const t = audioCtx.currentTime;

                // 1. Capa de Ruido (Explosión de Polvora / Chasquido Cañón)
                const bufferSize = audioCtx.sampleRate * 0.22;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(3200, t);
                filter.frequency.exponentialRampToValueAtTime(250, t + 0.18);

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(soundVolume * 0.85, t);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start(t);

                // 2. Capa de Impacto Grave (Punch / Detonación)
                const osc = audioCtx.createOscillator();
                const oscGain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(210, t);
                osc.frequency.exponentialRampToValueAtTime(35, t + 0.12);

                oscGain.gain.setValueAtTime(soundVolume * 0.9, t);
                oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);

                osc.connect(oscGain);
                oscGain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.12);
            } catch(e) {}
        }

        // SONIDO DE IMPACTO DE DIANA MEJORADO (EFECTO MINI-EXPLOSIÓN)
        function playHitSound() {
            if (!audioCtx || soundVolume <= 0) return;
            try {
                const t = audioCtx.currentTime;

                // 1. Ruido Estallido Extendido (Onda expansiva)
                const bufferSize = audioCtx.sampleRate * 0.32;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1400, t);
                filter.frequency.exponentialRampToValueAtTime(80, t + 0.28);

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(soundVolume * 0.95, t);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start(t);

                // 2. Sub-Bass Retumbo de la Mini-Explosión
                const subOsc = audioCtx.createOscillator();
                const subGain = audioCtx.createGain();
                subOsc.type = 'sine';
                subOsc.frequency.setValueAtTime(160, t);
                subOsc.frequency.exponentialRampToValueAtTime(25, t + 0.26);

                subGain.gain.setValueAtTime(soundVolume * 1.0, t);
                subGain.gain.exponentialRampToValueAtTime(0.001, t + 0.26);

                subOsc.connect(subGain);
                subGain.connect(audioCtx.destination);
                subOsc.start(t);
                subOsc.stop(t + 0.26);
            } catch(e) {}
        }

        function createStickerTexture(type) {
            if (!type || type === 'none') return null;

            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 256, 256);

            if (type === 'star') { 
                const grad = ctx.createLinearGradient(0, 0, 256, 256);
                grad.addColorStop(0, '#00ffff'); grad.addColorStop(0.5, '#ff00ff'); grad.addColorStop(1, '#ffff00');
                ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(128, 128, 95, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#111'; ctx.font = '900 110px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('★', 128, 130);
            } 
            else if (type === 'lightning') { 
                ctx.fillStyle = '#8b5cf6'; ctx.beginPath(); ctx.arc(128, 128, 95, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 10; ctx.strokeStyle = '#00ffff'; ctx.stroke();
                ctx.fillStyle = '#00ffff'; ctx.font = '900 100px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('⚡', 128, 128);
            }
            else if (type === 'bio') { 
                ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(128, 128, 95, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000000'; ctx.font = '900 100px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('☣', 128, 128);
            }
            else if (type === 'flame') { 
                ctx.fillStyle = '#ff3300'; ctx.beginPath(); ctx.arc(128, 128, 95, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 12; ctx.strokeStyle = '#ffffff'; ctx.stroke();
                ctx.fillStyle = '#ffcc00'; ctx.font = '900 80px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('🔥', 128, 128);
            }
            else if (type === 'beast') { 
                ctx.fillStyle = '#ec4899'; ctx.beginPath(); ctx.arc(128, 128, 95, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#111827'; ctx.font = '900 90px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('💀', 128, 128);
            }
            else if (type === 'sun') { 
                ctx.fillStyle = '#eab308'; ctx.beginPath(); ctx.arc(128, 128, 95, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffffff'; ctx.font = '900 90px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('☀️', 128, 128);
            }
            else if (type === 'atom') { 
                ctx.fillStyle = '#6366f1'; ctx.beginPath(); ctx.arc(128, 128, 95, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#00ffff'; ctx.font = '900 90px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('⚛️', 128, 128);
            }
            else if (type === 'dragon') { 
                ctx.fillStyle = '#111111'; ctx.beginPath(); ctx.arc(128, 128, 95, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 10; ctx.strokeStyle = '#ffd700'; ctx.stroke();
                ctx.fillStyle = '#ffd700'; ctx.font = '900 85px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('🐲', 128, 128);
            }
            else if (type === 'crown') { 
                const grad = ctx.createRadialGradient(128, 128, 20, 128, 128, 100);
                grad.addColorStop(0, '#fff3a1'); grad.addColorStop(1, '#d4af37');
                ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(128, 128, 95, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#1a1a1a'; ctx.font = '900 85px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('👑', 128, 128);
            }
            else if (type === 'dragon_gold') { 
                ctx.fillStyle = '#0f0f15'; ctx.beginPath(); ctx.arc(128, 128, 95, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 12; ctx.strokeStyle = '#ff0055'; ctx.stroke();
                ctx.fillStyle = '#ffd700'; ctx.font = '900 90px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('🐉', 128, 128);
            }

            return new THREE.CanvasTexture(canvas);
        }

        function buildWeaponMesh(targetGroup, skinObj, isPreview = false) {
            while(targetGroup.children.length > 0) {
                targetGroup.remove(targetGroup.children[0]);
            }

            const isHud = !isPreview;
            const isWireframe = !!skinObj.wireframe;

            const mainMat = new THREE.MeshStandardMaterial({
                color: skinObj.color,
                roughness: skinObj.rough,
                metalness: skinObj.metal,
                emissive: skinObj.emissive || 0x000000,
                emissiveIntensity: skinObj.emissiveIntensity || 0,
                wireframe: isWireframe,
                depthTest: !isHud
            });
            
            const secColorHex = skinObj.colorSec !== undefined ? skinObj.colorSec : 0x181a1d;
            const secondaryMat = new THREE.MeshStandardMaterial({ 
                color: secColorHex, 
                roughness: 0.7, 
                metalness: 0.1, 
                wireframe: isWireframe,
                depthTest: !isHud 
            });

            const steelMat = new THREE.MeshStandardMaterial({ color: 0x555960, roughness: 0.3, metalness: 0.9, wireframe: isWireframe, depthTest: !isHud });

            const scaleFactor = skinObj.scale || 1.0;
            targetGroup.scale.set(scaleFactor, scaleFactor, scaleFactor);

            const frame = new THREE.Mesh(new THREE.BoxGeometry(0.034, 0.032, 0.21), secondaryMat);
            frame.position.set(0, -0.02, -0.03); if(isHud) frame.renderOrder = 999;
            targetGroup.add(frame);

            const grip = new THREE.Mesh(new THREE.BoxGeometry(0.032, 0.105, 0.048), secondaryMat);
            grip.position.set(0, -0.075, 0.025); grip.rotation.x = 0.25; if(isHud) grip.renderOrder = 999;
            targetGroup.add(grip);

            const guard = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.025, 0.05), secondaryMat);
            guard.position.set(0, -0.04, -0.02); if(isHud) guard.renderOrder = 999;
            targetGroup.add(guard);

            const innerBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.009, 0.21, 16), steelMat);
            innerBarrel.rotation.x = Math.PI / 2; innerBarrel.position.set(0, 0.002, -0.04); if(isHud) innerBarrel.renderOrder = 999;
            targetGroup.add(innerBarrel);

            const ejector = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.015, 0.04), steelMat);
            ejector.position.set(0.012, 0.008, -0.02); if(isHud) ejector.renderOrder = 999;
            targetGroup.add(ejector);

            const rearSight = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.008, 0.008), steelMat);
            rearSight.position.set(0, 0.023, 0.055); if(isHud) rearSight.renderOrder = 999;
            
            const frontSight = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.008, 0.008), steelMat);
            frontSight.position.set(0, 0.023, -0.125); if(isHud) frontSight.renderOrder = 999;
            targetGroup.add(rearSight, frontSight);

            if (skinObj.attach === 'heavy_deagle') {
                const slide = new THREE.Mesh(new THREE.BoxGeometry(0.042, 0.048, 0.25), mainMat);
                slide.position.set(0, 0.005, -0.04); if(isHud) slide.renderOrder = 999;

                const topRail = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.012, 0.20), secondaryMat);
                topRail.position.set(0, 0.033, -0.04); if(isHud) topRail.renderOrder = 999;

                targetGroup.add(slide, topRail);
            } 
            else {
                const slide = new THREE.Mesh(new THREE.BoxGeometry(0.036, 0.038, 0.22), mainMat);
                slide.position.set(0, 0.002, -0.035); if(isHud) slide.renderOrder = 999;
                targetGroup.add(slide);

                if (skinObj.attach === 'silencer') {
                    const silencer = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.017, 0.18, 16), secondaryMat);
                    silencer.rotation.x = Math.PI / 2; silencer.position.set(0, 0.002, -0.22); if(isHud) silencer.renderOrder = 999;
                    targetGroup.add(silencer);
                } 
                else if (skinObj.attach === 'scope') {
                    const scope = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.013, 0.11, 16), secondaryMat);
                    scope.rotation.x = Math.PI / 2; scope.position.set(0, 0.035, -0.02); if(isHud) scope.renderOrder = 999;
                    targetGroup.add(scope);
                }
                else if (skinObj.attach === 'compensator') {
                    const comp = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.042, 0.05), mainMat);
                    comp.position.set(0, 0.002, -0.16); if(isHud) comp.renderOrder = 999;
                    targetGroup.add(comp);
                }
            }

            if (skinObj.sticker && skinObj.sticker !== 'none') {
                const stickerTex = createStickerTexture(skinObj.sticker);
                if (stickerTex) {
                    const stickerMat = new THREE.MeshBasicMaterial({ map: stickerTex, transparent: true, depthTest: !isHud });
                    const stickerPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.035, 0.035), stickerMat);
                    stickerPlane.position.set(0.022, 0.005, -0.03);
                    stickerPlane.rotation.y = Math.PI / 2;
                    if(isHud) stickerPlane.renderOrder = 1000;

                    targetGroup.add(stickerPlane);
                }
            }
        }

        function createEnvironment() {
            const canvasSize = 128;
            const texCanvas = document.createElement('canvas');
            texCanvas.width = canvasSize; texCanvas.height = canvasSize;
            const tCtx = texCanvas.getContext('2d');
            tCtx.fillStyle = '#646975'; tCtx.fillRect(0, 0, canvasSize, canvasSize);
            tCtx.strokeStyle = '#515560'; tCtx.lineWidth = 4; tCtx.strokeRect(0, 0, canvasSize, canvasSize);

            const wallTexture = new THREE.CanvasTexture(texCanvas);
            wallTexture.wrapS = THREE.RepeatWrapping; wallTexture.wrapT = THREE.RepeatWrapping;
            wallTexture.repeat.set(16, 8);

            const roomGeo = new THREE.BoxGeometry(24, 10, 24);
            const roomMat = new THREE.MeshStandardMaterial({ map: wallTexture, side: THREE.BackSide, roughness: 0.8 });
            const room = new THREE.Mesh(roomGeo, roomMat);
            room.position.y = 5;
            scene.add(room);

            const floorGeo = new THREE.PlaneGeometry(24, 24);
            const floorCanvas = document.createElement('canvas');
            floorCanvas.width = 128; floorCanvas.height = 128;
            const fCtx = floorCanvas.getContext('2d');
            fCtx.fillStyle = '#bcbfc6'; fCtx.fillRect(0, 0, 128, 128);
            fCtx.strokeStyle = '#9ca0a8'; fCtx.lineWidth = 4; fCtx.strokeRect(0, 0, 128, 128);

            const floorTexture = new THREE.CanvasTexture(floorCanvas);
            floorTexture.wrapS = THREE.RepeatWrapping; floorTexture.wrapT = THREE.RepeatWrapping;
            floorTexture.repeat.set(16, 16);

            const floorMat = new THREE.MeshStandardMaterial({ map: floorTexture, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0.001;
            scene.add(floor);
        }

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body) return;

            const currentSens = baseSensitivity * parseFloat(sensSlider.value);

            yaw -= e.movementX * currentSens;
            pitch -= e.movementY * currentSens;
            pitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, pitch));

            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));

            weaponTargetX = baseWeaponPos.x - Math.max(-0.05, Math.min(0.05, e.movementX * 0.0003));
            weaponTargetY = baseWeaponPos.y + Math.max(-0.05, Math.min(0.05, e.movementY * 0.0003));
        });

        document.addEventListener('mousedown', () => {
            if (document.pointerLockElement !== document.body || !isPlaying) return;

            totalClicks++;

            // SONIDO DE DISPARO
            playGunshotSound();

            muzzleFlashMesh.material.opacity = 0.95;
            flashLight.intensity = 4.0;

            setTimeout(() => {
                if (muzzleFlashMesh) muzzleFlashMesh.material.opacity = 0;
                if (flashLight) flashLight.intensity = 0;
            }, 55);

            weaponGroup.position.z = -0.28;
            weaponGroup.rotation.x = 0.20;

            setTimeout(() => {
                if (weaponGroup) {
                    weaponGroup.position.z = baseWeaponPos.z;
                    weaponGroup.rotation.x = 0;
                }
            }, 85);

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(targets);

            if (intersects.length > 0) {
                const hitTarget = intersects[0].object;
                
                // SONIDO DE IMPACTO DE DIANA (MINI-EXPLOSIÓN)
                playHitSound();

                scene.remove(hitTarget);
                targets = targets.filter(t => t !== hitTarget);
                
                hitClicks++;
                score += 100;
                document.getElementById('score').textContent = score;

                // VERIFICACIÓN DE SUSPENSIÓN SI SUPERA LOS 15.000 PUNTOS
                if (score > 15000) {
                    triggerBan();
                    return;
                }

                spawnTarget();
            }

            updateAccuracy();
        });

        function startGame() {
            score = 0; totalClicks = 0; hitClicks = 0; timeLeft = 30;
            isPlaying = true;

            document.getElementById('score').textContent = score;
            document.getElementById('time').textContent = timeLeft;
            document.getElementById('accuracy').textContent = '100';

            targets.forEach(t => scene.remove(t));
            targets = [];

            for (let i = 0; i < 3; i++) {
                spawnTarget();
            }

            gameInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time').textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function spawnTarget() {
            const mode = modeSelect.value;
            const radius = mode === "microshot" ? 0.15 : 0.36;

            const geometry = new THREE.SphereGeometry(radius, 32, 32);
            const material = new THREE.MeshStandardMaterial({
                color: 0x00ffff,
                emissive: 0x007c7c,
                emissiveIntensity: 0.2,
                roughness: 0.3
            });
            
            const sphere = new THREE.Mesh(geometry, material);

            sphere.position.x = (Math.random() - 0.5) * 9;
            sphere.position.y = (Math.random() * 2.8) + 0.6;
            sphere.position.z = -10;

            scene.add(sphere);
            targets.push(sphere);
        }

        function updateAccuracy() {
            if (totalClicks === 0) return;
            const acc = Math.round((hitClicks / totalClicks) * 100);
            document.getElementById('accuracy').textContent = acc;
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            document.exitPointerLock();

            // VERIFICACIÓN DE SEGURIDAD POR SI SUPERA LOS 15.000 PUNTOS AL TERMINAR LA PARTIDA
            if (score > 15000) {
                triggerBan();
                return;
            }

            // SONIDO FIN DE PARTIDA
            playGameOverSound();

            const earnedCoins = Math.min(10, Math.max(1, Math.floor(score / 300)));
            coins += earnedCoins;
            saveUserData();
            updateUIValues();

            alert(`SESIÓN COMPLETADA\nPuntuación: ${score}\nPrecisión final: ${document.getElementById('accuracy').textContent}%\n\n🪙 HAS GANADO: ${earnedCoins} MONEDAS`);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying && weaponGroup) {
                weaponGroup.position.x += (weaponTargetX - weaponGroup.position.x) * 0.12;
                weaponGroup.position.y += (weaponTargetY - weaponGroup.position.y) * 0.12;
            }

            // LÓGICA DE AIMHACK (AIMBOT)
            if (isPlaying && isAimHacking && targets.length > 0) {
                let closestTarget = null;
                let minDist = Infinity;

                targets.forEach(t => {
                    const dist = camera.position.distanceTo(t.position);
                    if (dist < minDist) {
                        minDist = dist;
                        closestTarget = t;
                    }
                });

                if (closestTarget) {
                    const dir = new THREE.Vector3().subVectors(closestTarget.position, camera.position).normalize();
                    yaw = Math.atan2(-dir.x, -dir.z);
                    pitch = Math.asin(dir.y);
                    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                }
            }

            renderer.render(scene, camera);
        }

        init3D();
        animate();
    </script>
</body>
</html>
